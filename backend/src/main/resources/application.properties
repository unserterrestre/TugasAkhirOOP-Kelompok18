
spring.application.name=pusaka-backend
server.port=8080

# Database H2 berbasis file lokal agar akun tidak hilang saat server di-restart
spring.datasource.url=jdbc:h2:file:./data/pusakadb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Aktifkan H2 Console (bisa dicek di browser: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console